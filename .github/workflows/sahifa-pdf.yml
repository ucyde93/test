name: Sahifa PDF

on:
  push:
    paths:
      - 'sahifa-pdf/**'
      - '.github/workflows/sahifa-pdf.yml'
    tags:
      - 'sahifa-v*'
  pull_request:
    paths:
      - 'sahifa-pdf/**'
      - '.github/workflows/sahifa-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: sahifa-pdf

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sahifa-pdf/package-lock.json
      - run: npm ci
      - name: Security unit tests and end-to-end tests (real Electron app under a virtual display)
        run: xvfb-run -a npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sahifa-pdf/package-lock.json
      - run: npm ci
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Sahifa-PDF-${{ runner.os }}
          path: |
            sahifa-pdf/dist/*.exe
            sahifa-pdf/dist/*.dmg
            sahifa-pdf/dist/*.zip
            sahifa-pdf/dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/sahifa-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          name: Sahifa PDF ${{ github.ref_name }}
          body: Free, offline PDF reader and editor. Download the installer for your system below.
