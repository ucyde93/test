<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: data: blob:; font-src 'self' file: data: blob:; worker-src 'self' file: blob:; connect-src 'self' file: data: blob:; object-src 'none'; base-uri 'none'">
  <title>Sahifa PDF</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home">
  <div id="app">
    <!-- Window frame: brand menu, Home, document tabs, search. The OS window buttons sit over the right end. -->
    <header id="titlebar">
      <button id="brandMenu" class="brand" title="Menu" aria-label="Sahifa PDF menu">
        <img src="../build/icon.png" alt="" class="brand-icon">
        <span class="brand-name">Sahifa <b>PDF</b></span>
        <span class="brand-chev" id="brandChev"></span>
      </button>
      <button id="homeTab" class="tb-home on" aria-label="Home"><span id="homeIcon"></span><span>Home</span></button>
      <nav id="docTabs" role="tablist" aria-label="Open documents"></nav>
      <div class="tb-drag"></div>
      <div class="find" role="search">
        <span id="searchIcon" class="find-icon"></span>
        <input id="findInput" type="search" placeholder="Search in document" aria-label="Search in document" autocomplete="off" spellcheck="false">
        <span id="findCount" class="find-count" aria-live="polite"></span>
        <button id="findPrev" class="find-btn" aria-label="Previous result" title="Previous (Shift+Enter)"></button>
        <button id="findNext" class="find-btn" aria-label="Next result" title="Next (Enter)"></button>
        <kbd class="find-kbd">Ctrl F</kbd>
      </div>
      <button id="themeBtn" class="frame-btn" aria-label="Change theme"></button>
    </header>

    <div id="main">
      <nav id="rail" aria-label="Tool sets"></nav>
      <div id="content">
        <div id="toolbar" role="toolbar" aria-label="Tools">
          <div id="toolGroups" class="tool-groups"></div>
          <div class="toolbar-end">
            <span id="docState" class="doc-state" aria-live="polite"></span>
            <button id="tbUndo" class="icon-btn" aria-label="Undo" title="Undo (Ctrl+Z)"></button>
            <button id="tbRedo" class="icon-btn" aria-label="Redo" title="Redo (Ctrl+Y)"></button>
            <button id="tbPrint" class="icon-btn" aria-label="Print" title="Print (Ctrl+P)"></button>
            <button id="tbSave" class="btn btn-primary btn-sm" title="Save (Ctrl+S)">Save</button>
          </div>
        </div>
        <div id="contextBar" role="toolbar" aria-label="Properties"></div>
        <main id="workspace">
          <aside id="sidebar" hidden>
            <div id="sideTabs" role="tablist" aria-label="Panels"></div>
            <div id="sidePanel"></div>
          </aside>
          <section id="stage">
            <div id="banner" hidden></div>
            <div id="viewer" data-mode="select" hidden>
              <div id="pages"></div>
            </div>
            <div id="organizer" hidden></div>
            <div id="pageControls" class="page-controls" role="toolbar" aria-label="Page and zoom">
              <button id="sbPrev" class="pc-btn"></button>
              <span class="pc-page"><input id="pageInput" type="text" inputmode="numeric" aria-label="Page number"><span id="pageCount"></span></span>
              <button id="sbNext" class="pc-btn"></button>
              <span class="pc-sep"></span>
              <button id="sbZoomOut" class="pc-btn"></button>
              <button id="zoomLabel" class="pc-zoom" title="Set zoom" aria-label="Zoom level"></button>
              <button id="sbZoomIn" class="pc-btn"></button>
              <span class="pc-sep"></span>
              <button id="sbFitWidth" class="pc-btn"></button>
              <button id="sbFitPage" class="pc-btn"></button>
              <button id="sbNight" class="pc-btn"></button>
            </div>
          </section>
        </main>
      </div>
    </div>

    <section id="home" aria-label="Home"></section>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="busy" hidden><div class="busy-card"><span class="spinner" aria-hidden="true"></span><span id="busyLabel">Working…</span></div></div>
  <div id="dropHint" aria-hidden="true"><div><span id="dropIcon"></span>Drop to open in Sahifa PDF</div></div>
  <div id="splash" aria-hidden="true">
    <div class="splash-inner">
      <img src="../build/icon.png" alt="" class="splash-icon">
      <div class="splash-name">Sahifa <b>PDF</b></div>
      <div class="splash-by">A product of MV Digital Tools</div>
      <div class="splash-bar"><span></span></div>
    </div>
  </div>
  <div id="printRoot"></div>

  <script src="../node_modules/pdfjs-dist/build/pdf.min.js"></script>
  <script src="../node_modules/@cantoo/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/host.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/core.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/annots.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/organize.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
