<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280">
  <defs>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7cff" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#5b7cff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="back1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee0ff"/>
      <stop offset="1" stop-color="#2f8bff"/>
    </linearGradient>
    <linearGradient id="back2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa9ff"/>
      <stop offset="1" stop-color="#5865f2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2fb"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe6ff"/>
      <stop offset="1" stop-color="#b9c6ff"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="1" stop-color="#e5294a"/>
    </linearGradient>
    <linearGradient id="chipViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#7b4dff"/>
    </linearGradient>
    <linearGradient id="chipBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="chipSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe3ff"/>
      <stop offset="1" stop-color="#22a7f0"/>
    </linearGradient>
    <linearGradient id="chipTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff0c4"/>
      <stop offset="1" stop-color="#12b892"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#7d8cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7d8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#3a4bd8" flood-opacity=".22"/>
    </filter>
    <filter id="chip" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a3bb8" flood-opacity=".28"/>
    </filter>
  </defs>

  <ellipse cx="236" cy="150" rx="190" ry="120" fill="url(#glow)"/>
  <!-- orbit -->
  <path d="M70 175c-30-60 120-130 250-120 92 7 120 52 80 92" fill="none" stroke="url(#orbit)" stroke-width="3" stroke-linecap="round"/>
  <path d="M392 150c-40 50-160 92-262 70" fill="none" stroke="url(#orbit)" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <!-- back documents -->
  <g filter="url(#soft)">
    <rect x="232" y="52" width="128" height="166" rx="16" transform="rotate(14 296 135)" fill="url(#back1)"/>
    <rect x="216" y="44" width="128" height="166" rx="16" transform="rotate(7 280 127)" fill="url(#back2)" opacity=".92"/>
    <rect x="216" y="44" width="128" height="166" rx="16" transform="rotate(7 280 127)" fill="url(#gloss)"/>
  </g>

  <!-- front document -->
  <g filter="url(#soft)" transform="rotate(-5 228 140)">
    <path d="M168 40h86l42 42v128a14 14 0 0 1-14 14H168a14 14 0 0 1-14-14V54a14 14 0 0 1 14-14z" fill="url(#paper)"/>
    <path d="M254 40v30a12 12 0 0 0 12 12h30z" fill="url(#fold)"/>
    <rect x="176" y="62" width="44" height="22" rx="7" fill="url(#badge)"/>
    <text x="198" y="78" text-anchor="middle" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="800" font-size="12" fill="#fff" letter-spacing=".5">PDF</text>
    <rect x="176" y="100" width="100" height="7" rx="3.5" fill="#dfe4f0"/>
    <rect x="176" y="114" width="84" height="7" rx="3.5" fill="#dfe4f0"/>
    <rect x="176" y="128" width="96" height="7" rx="3.5" fill="#dfe4f0"/>
    <path d="M178 182c14-3 20-28 31-28 10 0 1 23 11 23 7 0 10-11 18-11 6 0 7 6 12 6" fill="none" stroke="#4b6bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="176" y="196" width="88" height="3" rx="1.5" fill="#cfd6e6"/>
  </g>

  <!-- floating glass chips -->
  <g filter="url(#chip)">
    <rect x="322" y="18" width="46" height="46" rx="13" fill="url(#chipViolet)"/>
    <rect x="322" y="18" width="46" height="23" rx="13" fill="url(#gloss)"/>
    <path d="M337 50l2-7 13-13a3 3 0 0 1 4 4l-13 13z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>

    <rect x="70" y="150" width="50" height="50" rx="14" fill="url(#chipBlue)"/>
    <rect x="70" y="150" width="50" height="25" rx="14" fill="url(#gloss)"/>
    <path d="M81 183c5-1 7-11 11-11s1 9 5 9 4-5 7-5 3 3 6 3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M81 190h28" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/>

    <rect x="358" y="128" width="50" height="50" rx="14" fill="url(#chipSky)"/>
    <rect x="358" y="128" width="50" height="25" rx="14" fill="url(#gloss)"/>
    <path d="M369 160c5-1 7-11 11-11s1 9 5 9 4-5 7-5 3 3 6 3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M369 167h28" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/>

    <rect x="294" y="206" width="42" height="42" rx="12" fill="url(#chipTeal)"/>
    <rect x="294" y="206" width="42" height="21" rx="12" fill="url(#gloss)"/>
    <rect x="306" y="216" width="18" height="22" rx="3" fill="none" stroke="#fff" stroke-width="2.4"/>
    <path d="M310 224h10M310 230h7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#7b8cff">
    <path d="M120 70l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity=".9"/>
    <path d="M86 104l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity=".55"/>
    <path d="M420 92l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" fill="#3fb5ff" opacity=".85"/>
  </g>
</svg>
